version: "3.8"
services:
  # SQL Server コンテナ
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jambubble_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - jambubble_data:/var/opt/mssql

  # ASP.NET Core
  server:
    build:
      context: .
      dockerfile: Server/Dockerfile
    container_name: jambubble_server
    ports:
      - "9000:9000"
      - "9001:9001"
    depends_on:
      - sqlserver
    volumes:
      - ./uploads:/app/wwwroot/images
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:9001
      - ASPNETCORE_ENVIRONMENT=Development
      - SQLSERVER_CONNECTION=Server=sqlserver;Database=JamBubble;User Id=sa;Password=YourStrong!Password123;TrustServerCertificate=True;
      - JWT__KEY=bHkLerAqoeAE4nxay6o42NxiN4HAc3eO
      - JWT__ISSUER=JamBubble
      - JWT__AUDIENCE=JamBubbleUsers

volumes:
  jambubble_data: